    <p class="kicker">FACT CENTER</p>
    <h1>事实中心 / 数据中心</h1>
    <p>在罗忠富的框架里，数据中心没有消失，而是迎来第二次生命。AI 改变的不是数据库本身，而是数据被消费的方式：模型需要的是带语义、血缘、指标和上下文的事实。</p>
    <blockquote>数据中心保存的不是简单的数据，而是组织运行过程中持续产生的真实事实。</blockquote>
    <p>建设重点包括：数据目录、业务元数据、数据血缘、指标中心、数据产品，以及 AI 可阅读的上下文说明。公开报道中，他也强调非结构化数据（图片、视频、协议）应进入同一套数据与知识体系。</p>
    <p>详见 <a href="/book/ch06.html">第六章</a>、<a href="/book/ch07.html">第七章</a>。</p>
