    <p class="kicker">WORKFLOW</p>
    <h1>Workflow</h1>
    <p>在罗忠富看来，传统 Workflow 只推动单据流转；AI Workflow 则让节点开始理解内容：取数、写报告、处理图片、检查票据，再交给人审核发布。</p>
    <blockquote>流程可以不变，但是节点必须变智能。</blockquote>
    <p>典型场景包括捐赠人反馈报告、财务报销、项目结项、风控合规。最终方向是资金流、项目流、数据流三流合一，从月底对账走向实时一致。</p>
    <p>详见 <a href="/book/ch13.html">第十三章</a>、<a href="/book/ch15.html">第十五章</a>。</p>
