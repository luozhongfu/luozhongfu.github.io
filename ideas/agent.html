    <p class="kicker">AI AGENT</p>
    <h1>AI Agent</h1>
    <p>罗忠富强调：Agent 不是聊天机器人。一个能进入慈善业务的智能体，需要目标、规划、推理、工具、记忆、反思、工作流和编排，并且必须接到组织自己的数据、知识和规则。</p>
    <blockquote>它不仅要聪明，还要可信；不仅要完成任务，还要能够解释。</blockquote>
    <p>公开实践中，他谈到定制化智能体：用规则监控协议与拨款节奏；用 AI 重构票据审核；用智能客服和助手服务捐赠人，并对图片打码保护隐私。</p>
    <p>详见 <a href="/book/ch12.html">第十二章</a>、<a href="/practice.html">实践</a>。</p>
