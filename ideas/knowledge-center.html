    <p class="kicker">KNOWLEDGE CENTER</p>
    <h1>知识中心</h1>
    <p>罗忠富认为，很多机构有数据，却没有知识。文档只是载体；真正重要的是制度背后的规则、案例背后的经验、流程背后的逻辑。</p>
    <blockquote>知识中心不是文档中心，而是组织智慧中心。</blockquote>
    <p>知识应分层：原始知识、结构化知识、语义知识、推理知识。RAG 能解决检索，但碎片化、缺语义、难综合、权限复杂。知识图谱能补关系，仍须与本体和规则连接。公开表述中，他称之为动态知识中枢。</p>
    <p>详见 <a href="/book/ch08.html">第八章</a>、<a href="/book/ch09.html">第九章</a>。</p>
