    <h1>本体</h1>
    <p>罗忠富把本体论放在数字底座第一层：先回答世界里有什么，再谈数据和模型。慈善组织的核心对象通常只有几十个，例如人、组织、项目、资金、预算、合同、事件、资源、知识和规则。</p>
    <blockquote>本体建设不是IT建模，而是组织认知工程。</blockquote>
    <p>知识来源上，他强调两套最被低估的行业资产：慈善中国的监管知识，以及财务科目的资金分类学。方法上提出 CDOM 五步法：识别对象、定义属性、建立关系、提炼规则、持续演进。</p>
