    <p class="kicker">RULE CENTER</p>
    <h1>规则中心</h1>
    <p>罗忠富把可信 AI 分成三层：模型会不会理解，知识有没有业务，规则能不能守住组织边界。规则中心就是第三层。</p>
    <blockquote>知识负责理解，规则负责执行。</blockquote>
    <p>规则来自法律法规、组织制度、业务规则、审批规则、风险规则和 AI 安全规则。它们必须建立在本体之上，对象化成 Rule Object，并形成规则网络。流程解决事情怎么走，规则解决事情是否允许。</p>
    <p>详见 <a href="/book/ch10.html">第十章</a>。</p>
